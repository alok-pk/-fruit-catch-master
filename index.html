<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>BioLab 3D — Human Anatomy Explorer</title>

<style>
  :root{
    --bg:#0d1117;
    --panel:#111823;
    --panel-edge:#1c2733;
    --neon:#39ff88;
    --neon-dim:#1f8a52;
    --blue:#3fd0ff;
    --blue-dim:#0f5b74;
    --text:#dbe6ef;
    --text-dim:#7f93a6;
    --danger:#ff4d6d;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg);
    font-family:'Segoe UI', Arial, sans-serif;
    color:var(--text);
    overflow:hidden;
  }
  #app{ position:fixed; inset:0; }
  #canvas-holder{ position:absolute; inset:0; }
  canvas{ display:block; touch-action:none; }

  /* ---------- glow scanline background ---------- */
  #app::before{
    content:"";
    position:absolute; inset:0; pointer-events:none; z-index:1;
    background:
      radial-gradient(circle at 20% 15%, rgba(63,208,255,0.07), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(57,255,136,0.07), transparent 45%);
  }

  /* ---------- HEADER ---------- */
  #header{
    position:absolute; top:0; left:0; right:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px;
    background:linear-gradient(180deg, rgba(13,17,23,0.95), rgba(13,17,23,0.55));
    border-bottom:1px solid var(--panel-edge);
    backdrop-filter:blur(6px);
  }
  #logo{
    display:flex; align-items:center; gap:10px;
    font-weight:700; letter-spacing:1px; font-size:15px;
    color:var(--neon); text-shadow:0 0 8px rgba(57,255,136,0.6);
  }
  #logo span.sub{
    display:block; font-size:9px; color:var(--blue); letter-spacing:2px; font-weight:400;
    text-shadow:0 0 6px rgba(63,208,255,0.6);
  }
  .pulse-dot{
    width:9px; height:9px; border-radius:50%; background:var(--neon);
    box-shadow:0 0 8px 2px var(--neon);
    animation:pulseDot 1.2s ease-in-out infinite;
  }
  @keyframes pulseDot{0%,100%{opacity:1; transform:scale(1);}50%{opacity:.4; transform:scale(.7);}}

  .header-controls{ display:flex; align-items:center; gap:8px; }
  .toggle-btn{
    background:var(--panel); border:1px solid var(--panel-edge); color:var(--text-dim);
    border-radius:20px; padding:6px 12px; font-size:11px; cursor:pointer;
    display:flex; align-items:center; gap:6px; transition:.2s;
    white-space:nowrap;
  }
  .toggle-btn:hover{ border-color:var(--blue); color:var(--blue); }
  .toggle-btn.active{ border-color:var(--neon); color:var(--neon); box-shadow:0 0 10px rgba(57,255,136,0.25); }
  #muteBtn.muted{ color:var(--danger); border-color:var(--danger); }

  /* ---------- SIDE PANELS ---------- */
  .side-panel{
    position:absolute; top:64px; bottom:14px; z-index:15;
    width:78px; display:flex; flex-direction:column; gap:8px;
    padding:10px 6px; overflow-y:auto; scrollbar-width:none;
  }
  .side-panel::-webkit-scrollbar{ display:none; }
  #leftPanel{ left:10px; }

  .organ-btn{
    background:var(--panel); border:1px solid var(--panel-edge);
    border-radius:12px; padding:8px 4px; cursor:pointer; text-align:center;
    color:var(--text-dim); transition:.2s; position:relative;
  }
  .organ-btn:hover{ border-color:var(--blue); color:var(--blue); transform:translateY(-2px); }
  .organ-btn.selected{
    border-color:var(--neon); color:var(--neon);
    box-shadow:0 0 12px rgba(57,255,136,0.35), inset 0 0 8px rgba(57,255,136,0.15);
  }
  .organ-btn .icon{ font-size:20px; display:block; margin-bottom:3px; filter:drop-shadow(0 0 3px currentColor);}
  .organ-btn .label{ font-size:9px; letter-spacing:.5px; line-height:1.2; display:block; }
  .organ-btn.heart-btn{
    border-color:var(--danger);
    background:linear-gradient(160deg, rgba(255,77,109,0.12), var(--panel));
  }
  .organ-btn.heart-btn .icon{ color:var(--danger); animation:heartIcon 1.5s ease-in-out infinite; }
  @keyframes heartIcon{0%,100%{transform:scale(1);}25%{transform:scale(1.18);}40%{transform:scale(1);}55%{transform:scale(1.12);}70%{transform:scale(1);}}

  /* ---------- INFO CARD ---------- */
  #infoCard{
    position:absolute; left:50%; bottom:16px; transform:translateX(-50%) translateY(140%);
    z-index:20; width:min(92%, 480px);
    background:linear-gradient(160deg, rgba(17,24,35,0.96), rgba(13,17,23,0.96));
    border:1px solid var(--neon-dim); border-radius:16px;
    padding:16px 18px; box-shadow:0 0 30px rgba(57,255,136,0.12), 0 10px 40px rgba(0,0,0,0.5);
    transition:transform .45s cubic-bezier(.2,.9,.25,1), opacity .3s;
    opacity:0;
  }
  #infoCard.show{ transform:translateX(-50%) translateY(0); opacity:1; }
  #infoCard .close-x{
    position:absolute; top:10px; right:12px; cursor:pointer; color:var(--text-dim);
    font-size:16px; line-height:1;
  }
  #infoCard .close-x:hover{ color:var(--danger); }
  #infoName{
    font-size:20px; font-weight:700; color:var(--neon); text-shadow:0 0 8px rgba(57,255,136,0.5);
    margin:0 0 4px 0; display:flex; align-items:center; gap:10px;
  }
  #infoPronounce{ font-size:12px; color:var(--blue); margin:0 0 8px 0; letter-spacing:.3px; }
  #infoDesc{ font-size:13.5px; line-height:1.5; color:var(--text); margin:0 0 10px 0; }
  #listenBtn{
    background:rgba(63,208,255,0.1); border:1px solid var(--blue-dim); color:var(--blue);
    border-radius:20px; padding:7px 16px; font-size:12px; cursor:pointer; transition:.2s;
  }
  #listenBtn:hover{ background:rgba(63,208,255,0.2); box-shadow:0 0 10px rgba(63,208,255,0.3); }

  /* ---------- LOADER ---------- */
  #loader{
    position:absolute; inset:0; z-index:50; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    transition:opacity .6s ease;
  }
  #loader .ring{
    width:56px; height:56px; border-radius:50%;
    border:3px solid rgba(57,255,136,0.15); border-top-color:var(--neon);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  #loader p{ color:var(--text-dim); font-size:12px; letter-spacing:2px; }

  /* ---------- HINT ---------- */
  #hint{
    position:absolute; top:64px; left:50%; transform:translateX(-50%);
    z-index:10; font-size:11px; color:var(--text-dim); letter-spacing:.5px;
    background:rgba(13,17,23,0.6); padding:5px 12px; border-radius:20px;
    border:1px solid var(--panel-edge); pointer-events:none; transition:opacity .5s;
  }

  /* heartbeat vignette pulse when heart active */
  #bpmBadge{
    position:absolute; top:64px; right:16px; z-index:16;
    background:rgba(255,77,109,0.12); border:1px solid var(--danger); color:#ffb3c0;
    border-radius:20px; padding:5px 12px; font-size:11px; display:none; align-items:center; gap:6px;
    letter-spacing:.5px;
  }
  #bpmBadge.show{ display:flex; }
  #bpmBadge .dot{ width:7px; height:7px; border-radius:50%; background:var(--danger); box-shadow:0 0 6px var(--danger); animation:pulseDot .75s ease-in-out infinite; }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:640px){
    .side-panel{ width:60px; top:58px; }
    .organ-btn .label{ font-size:7.5px; }
    .organ-btn .icon{ font-size:16px; }
    #logo{ font-size:12px; }
    #logo span.sub{ font-size:7px; }
    .toggle-btn{ padding:5px 8px; font-size:9.5px; }
    #infoName{ font-size:16px; }
    #infoDesc{ font-size:12px; }
    #hint{ font-size:9px; top:56px; }
    #bpmBadge{ top:56px; font-size:9px; padding:4px 8px; }
  }
</style>
</head>
<body>
<div id="app">

  <div id="loader">
    <div class="ring"></div>
    <p>INITIALIZING ANATOMY LAB…</p>
  </div>

  <div id="header">
    <div id="logo">
      <span class="pulse-dot"></span>
      <span>
        BIOLAB 3D
        <span class="sub" id="headerSub">HUMAN ANATOMY EXPLORER</span>
      </span>
    </div>
    <div class="header-controls">
      <button class="toggle-btn" id="genderBtn">♂ <span id="genderLabel">MALE</span></button>
      <button class="toggle-btn" id="langBtn">🌐 <span id="langLabel">EN</span></button>
      <button class="toggle-btn" id="muteBtn">🔊 <span id="muteLabel">SOUND</span></button>
    </div>
  </div>

  <div id="hint">Drag to rotate • Scroll / Pinch to zoom • Tap a body part</div>
  <div id="bpmBadge"><span class="dot"></span><span id="bpmText">80 BPM</span></div>

  <div class="side-panel" id="leftPanel"></div>

  <div id="canvas-holder"></div>

  <div id="infoCard">
    <span class="close-x" id="closeInfo">✕</span>
    <h2 id="infoName">—</h2>
    <p id="infoPronounce">—</p>
    <p id="infoDesc">—</p>
    <button id="listenBtn">🔊 Listen</button>
  </div>

</div>

<script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =========================================================
   DATA — organ / system info (EN + HI)
========================================================= */
const DATA = {
  skull: {
    icon:'💀', key:'skull',
    en:{ name:'Skull', pronounce:'Pronunciation: SKUHL', desc:'The skull is a hard bony helmet that protects your brain. It also gives your face its shape!' },
    hi:{ name:'खोपड़ी', pronounce:'इसे पढ़ें: खोप-ड़ी', desc:'खोपड़ी एक कठोर हड्डी का ढांचा है जो आपके दिमाग की रक्षा करता है और चेहरे को आकार देता है।' }
  },
  brain: {
    icon:'🧠', key:'brain',
    en:{ name:'Brain', pronounce:'Pronunciation: BRAYN', desc:'The brain is your body\u2019s control center — it helps you think, move, and feel everything around you.' },
    hi:{ name:'दिमाग', pronounce:'इसे पढ़ें: दि-माग', desc:'दिमाग आपके शरीर का कंट्रोल सेंटर है, यह आपको सोचने, चलने और महसूस करने में मदद करता है।' }
  },
  heart: {
    icon:'❤️', key:'heart',
    en:{ name:'Heart', pronounce:'Pronunciation: HAART | इसे पढ़ें: हार्ट', desc:'The heart is a strong pump that beats non-stop, pushing blood full of oxygen to every part of your body!' },
    hi:{ name:'हृदय / दिल', pronounce:'इसे पढ़ें: हृ-दय / दिल', desc:'हृदय एक शक्तिशाली पंप है जो लगातार धड़कता है और ऑक्सीजन भरा खून पूरे शरीर में भेजता है!' }
  },
  skeleton: {
    icon:'🦴', key:'skeleton',
    en:{ name:'Skeleton', pronounce:'Pronunciation: SKEL-ih-tn', desc:'Your skeleton is made of 206 bones! It gives your body shape and lets you stand tall and move around.' },
    hi:{ name:'कंकाल', pronounce:'इसे पढ़ें: कं-काल', desc:'आपका कंकाल 206 हड्डियों से बना है! यह शरीर को आकार देता है और आपको खड़े होने में मदद करता है।' }
  },
  muscles: {
    icon:'💪', key:'muscles',
    en:{ name:'Muscles', pronounce:'Pronunciation: MUHS-uhls', desc:'Muscles are stretchy tissues that pull on your bones so you can run, jump, and even smile!' },
    hi:{ name:'मांसपेशियां', pronounce:'इसे पढ़ें: मां-स-पे-शि-यां', desc:'मांसपेशियां हड्डियों को खींचती हैं जिससे आप दौड़ सकते हैं, कूद सकते हैं और मुस्कुरा भी सकते हैं!' }
  },
  nerves: {
    icon:'⚡', key:'nerves',
    en:{ name:'Nerves', pronounce:'Pronunciation: NURVZ', desc:'Nerves are like tiny electric wires that carry messages between your brain and the rest of your body.' },
    hi:{ name:'तंत्रिकाएं', pronounce:'इसे पढ़ें: तं-त्रि-का-एं', desc:'तंत्रिकाएं छोटे बिजली के तारों की तरह होती हैं जो दिमाग और शरीर के बीच संदेश ले जाती हैं।' }
  },
  lungs: {
    icon:'🫁', key:'lungs',
    en:{ name:'Lungs', pronounce:'Pronunciation: LUHNGZ', desc:'Your lungs breathe in fresh air and send oxygen into your blood so your whole body can work.' },
    hi:{ name:'फेफड़े', pronounce:'इसे पढ़ें: फे-फ-ड़े', desc:'फेफड़े ताज़ी हवा अंदर लेते हैं और ऑक्सीजन खून में भेजते हैं ताकि पूरा शरीर काम कर सके।' }
  },
  arm: {
    icon:'💪', key:'arm',
    en:{ name:'Arm Bones', pronounce:'Pronunciation: AARM BOHNZ', desc:'Arm bones connect at the shoulder and elbow, working like levers so you can lift and grab things.' },
    hi:{ name:'बांह की हड्डियां', pronounce:'इसे पढ़ें: बांह की हड्डि-यां', desc:'बांह की हड्डियां कंधे और कोहनी से जुड़ती हैं, जिससे आप चीज़ें उठा और पकड़ सकते हैं।' }
  },
  leg: {
    icon:'🦵', key:'leg',
    en:{ name:'Leg Bones', pronounce:'Pronunciation: LEG BOHNZ', desc:'Your leg bones are the longest and strongest bones — they carry your whole body when you walk or run.' },
    hi:{ name:'पैर की हड्डियां', pronounce:'इसे पढ़ें: पैर की हड्डि-यां', desc:'आपके पैर की हड्डियां सबसे लंबी और मज़बूत होती हैं, ये चलने-दौड़ने में शरीर को सहारा देती हैं।' }
  },
  spine: {
    icon:'🦴', key:'spine',
    en:{ name:'Spine', pronounce:'Pronunciation: SPAHYN', desc:'The spine is a stack of small bones that lets you bend and twist, while protecting your nerve cord.' },
    hi:{ name:'रीढ़ की हड्डी', pronounce:'इसे पढ़ें: री-ढ़ की हड्डी', desc:'रीढ़ की हड्डी छोटी हड्डियों का ढेर है जो आपको झुकने में मदद करती है और तंत्रिका को सुरक्षित रखती है।' }
  }
};

const SIDEBAR_ITEMS = ['skull','brain','heart','skeleton','muscles','nerves'];

/* =========================================================
   STATE
========================================================= */
let state = {
  lang: 'en',
  gender: 'male',
  muted: false,
  heartActive: false,
  selectedKey: null
};

/* =========================================================
   BUILD LEFT SIDEBAR BUTTONS
========================================================= */
const leftPanel = document.getElementById('leftPanel');
SIDEBAR_ITEMS.forEach(key=>{
  const d = DATA[key];
  const btn = document.createElement('div');
  btn.className = 'organ-btn' + (key==='heart' ? ' heart-btn':'');
  btn.dataset.key = key;
  btn.innerHTML = `<span class="icon">${d.icon}</span><span class="label">${d[state.lang].name}</span>`;
  btn.addEventListener('click', ()=> selectOrgan(key, true));
  leftPanel.appendChild(btn);
});

function refreshSidebarLabels(){
  document.querySelectorAll('.organ-btn').forEach(btn=>{
    const key = btn.dataset.key;
    btn.querySelector('.label').textContent = DATA[key][state.lang].name;
  });
}

/* =========================================================
   THREE.JS SCENE SETUP
========================================================= */
const holder = document.getElementById('canvas-holder');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
scene.fog = new THREE.FogExp2(0x0d1117, 0.028);

const camera = new THREE.PerspectiveCamera(45, holder.clientWidth/holder.clientHeight, 0.1, 200);
camera.position.set(0, 3.6, 9);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(holder.clientWidth, holder.clientHeight);
renderer.shadowMap.enabled = true;
holder.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.2;
controls.maxDistance = 20;
controls.target.set(0, 3.4, 0);
controls.update();

/* ---------- lighting: futuristic lab ---------- */
scene.add(new THREE.AmbientLight(0x334455, 0.9));

const keyLight = new THREE.DirectionalLight(0x9fd8ff, 1.1);
keyLight.position.set(5, 8, 6);
keyLight.castShadow = true;
scene.add(keyLight);

const rimGreen = new THREE.PointLight(0x39ff88, 6, 20);
rimGreen.position.set(-4, 5, -3);
scene.add(rimGreen);

const rimBlue = new THREE.PointLight(0x3fd0ff, 5, 20);
rimBlue.position.set(4, 2, 4);
scene.add(rimBlue);

/* ---------- lab floor grid ---------- */
const grid = new THREE.GridHelper(40, 40, 0x1f6a4a, 0x142433);
grid.position.y = 0;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);

/* =========================================================
   MATERIALS
========================================================= */
const boneMat = ()=> new THREE.MeshStandardMaterial({ color:0xe9e3d3, roughness:0.55, metalness:0.05 });
const boneMatF = ()=> new THREE.MeshStandardMaterial({ color:0xf1e6de, roughness:0.5, metalness:0.05 });
const muscleMat = ()=> new THREE.MeshStandardMaterial({ color:0xb4362f, roughness:0.6, metalness:0.05, transparent:true, opacity:0.55 });
const organMat = (c)=> new THREE.MeshStandardMaterial({ color:c, roughness:0.35, metalness:0.15, emissive:new THREE.Color(c).multiplyScalar(0.15) });
const nerveMat = ()=> new THREE.LineBasicMaterial({ color:0xffe14d, transparent:true, opacity:0.85 });
const skinMat = (c)=> new THREE.MeshStandardMaterial({ color:c, roughness:0.75, metalness:0.02, transparent:true, opacity:0.14 });

const NEON = new THREE.Color(0x39ff88);

/* =========================================================
   BUILD HUMAN FIGURE
========================================================= */
const human = new THREE.Group();
scene.add(human);

const bones = new THREE.Group(); bones.name='bones';
const muscles = new THREE.Group(); muscles.name='muscles';
const nerves = new THREE.Group(); nerves.name='nerves';
const organs = new THREE.Group(); organs.name='organs';
const skin = new THREE.Group(); skin.name='skin';
human.add(bones, muscles, nerves, organs, skin);

// interactive registry: mesh.uuid -> {key, originalEmissive}
const interactive = new Map();

function registerInteractive(mesh, key){
  mesh.userData.infoKey = key;
  interactive.set(mesh.uuid, mesh);
}

function makeBoneMaterial(){ return state.gender==='female' ? boneMatF() : boneMat(); }

/* ---- Legs ---- */
function buildLeg(x){
  const g = new THREE.Group();
  const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.13,1.5,16), makeBoneMaterial());
  thigh.position.set(x, 1.65, 0);
  const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.08,1.4,16), makeBoneMaterial());
  shin.position.set(x, 0.35, 0);
  const foot = new THREE.Mesh(new THREE.BoxGeometry(0.22,0.12,0.42), makeBoneMaterial());
  foot.position.set(x, -0.4, 0.12);
  [thigh,shin,foot].forEach(m=>{ m.castShadow=true; registerInteractive(m,'leg'); g.add(m); });
  return g;
}
bones.add(buildLeg(-0.32), buildLeg(0.32));

/* ---- Pelvis ---- */
const pelvis = new THREE.Mesh(new THREE.CapsuleGeometry(0.42,0.25,4,10), makeBoneMaterial());
pelvis.position.set(0,2.35,0); pelvis.rotation.z = Math.PI/2; pelvis.scale.set(1,0.65,0.8);
registerInteractive(pelvis,'skeleton'); bones.add(pelvis);

/* ---- Spine ---- */
const spine = new THREE.Group();
for(let i=0;i<9;i++){
  const seg = new THREE.Mesh(new THREE.SphereGeometry(0.1,10,10), makeBoneMaterial());
  seg.position.set(0, 2.65 + i*0.19, -0.02);
  registerInteractive(seg,'spine');
  spine.add(seg);
}
bones.add(spine);

/* ---- Ribcage ---- */
const ribcage = new THREE.Group();
for(let i=0;i<7;i++){
  const rib = new THREE.Mesh(new THREE.TorusGeometry(0.55 - i*0.012, 0.028, 8, 24, Math.PI*1.35), makeBoneMaterial());
  rib.position.set(0, 3.05 + i*0.16, -0.05);
  rib.rotation.set(Math.PI/2, 0, Math.PI*0.82);
  rib.castShadow = true;
  registerInteractive(rib,'skeleton');
  ribcage.add(rib);
}
const sternum = new THREE.Mesh(new THREE.BoxGeometry(0.1,1.1,0.08), makeBoneMaterial());
sternum.position.set(0, 3.6, 0.5);
registerInteractive(sternum,'skeleton');
ribcage.add(sternum);
bones.add(ribcage);

/* ---- Shoulders + Arms ---- */
function buildArm(x, sign){
  const g = new THREE.Group();
  const shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.16,12,12), makeBoneMaterial());
  shoulder.position.set(x, 4.05, 0);
  const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.08,1.1,14), makeBoneMaterial());
  upperArm.position.set(x + sign*0.05, 3.5, 0.05);
  upperArm.rotation.z = sign * 0.18;

/* =========================================================
   HIGHLIGHT LOGIC
========================================================= */
let highlighted = [];
function clearHighlight(){
  highlighted.forEach(m=>{
    if(m.userData.origEmissive !== undefined){
      m.material.emissive.copy(m.userData.origEmissive);
      m.material.emissiveIntensity = m.userData.origEmissiveIntensity ?? 1;
    }
  });
  highlighted = [];
}
function highlightMesh(mesh){
  if(!mesh.material || !mesh.material.emissive) return;
  if(mesh.userData.origEmissive === undefined){
    mesh.userData.origEmissive = mesh.material.emissive.clone();
    mesh.userData.origEmissiveIntensity = mesh.material.emissiveIntensity ?? 1;
  }
  mesh.material.emissive.set(NEON);
  mesh.material.emissiveIntensity = 1.4;
  highlighted.push(mesh);
}
function highlightGroupByKey(key){
  clearHighlight();
  interactive.forEach(mesh=>{
    if(mesh.userData.infoKey === key) highlightMesh(mesh);
  });
}

/* =========================================================
   CAMERA FOCUS ANIMATION
========================================================= */
let camAnim = null;
function focusCamera(targetPos, lookAt, duration=1000){
  camAnim = {
    startPos: camera.position.clone(),
    startTarget: controls.target.clone(),
    endPos: targetPos.clone(),
    endTarget: lookAt.clone(),
    startTime: performance.now(),
    duration
  };
  controls.enabled = false;
}
function updateCamAnim(now){
  if(!camAnim) return;
  const t = Math.min(1, (now - camAnim.startTime)/camAnim.duration);
  const ease = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
  camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
  controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, ease);
  if(t>=1){ camAnim=null; controls.enabled = true; }
}

/* =========================================================
   AUDIO — heartbeat synth (Web Audio API)
========================================================= */
let audioCtx = null;
let heartInterval = null;
function ensureAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
}
function thump(delay, freq, dur, vol){
  if(state.muted || !audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(freq, t0);
  osc.frequency.exponentialRampToValueAtTime(Math.max(20,freq*0.6), t0+dur);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol, t0+dur*0.18);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0+dur+0.02);
}
function playLubDub(){
  thump(0, 62, 0.16, 0.55);      // "lub"
  thump(0.16, 48, 0.14, 0.4);    // "dub"
}
const BEAT_MS = 750; // 80 BPM
function startHeartbeat(){
  if(heartInterval) return;
  ensureAudio();
  playLubDub();
  heartInterval = setInterval(playLubDub, BEAT_MS);
  document.getElementById('bpmBadge').classList.add('show');
}
function stopHeartbeat(){
  clearInterval(heartInterval);
  heartInterval = null;
  document.getElementById('bpmBadge').classList.remove('show');
}

/* heart visual pulse driven by clock, synced-ish to BEAT_MS */
let heartClockStart = performance.now();
function updateHeartPulse(now){
  if(!state.heartActive){ heartGroup.scale.setScalar(1); return; }
  const cyclePos = ((now - heartClockStart) % BEAT_MS) / BEAT_MS;
  // double-pump envelope: quick expand at 0 and at 0.22 (lub, dub)
  let s = 1;
  const pump = (center, width, amt)=>{
    const d = Math.abs(cyclePos-center);
    if(d < width){ s += amt * (1 - d/width); }
  };
  pump(0.02, 0.09, 0.22);
  pump(0.22, 0.07, 0.14);
  heartGroup.scale.setScalar(s);
}

}

/* =========================================================
   SELECT ORGAN (from sidebar or raycast)
========================================================= */
function selectOrgan(key, fromSidebar){
  document.querySelectorAll('.organ-btn').forEach(b=> b.classList.toggle('selected', b.dataset.key===key));

  highlightGroupByKey(key);
  showInfo(key);

  const view = FOCUS_VIEWS[key] || FOCUS_VIEWS.skeleton;
  focusCamera(view.pos, view.look, 1100);

  if(key === 'skeleton'){
    muscles.visible = false; nerves.visible = false;
  }
  if(key === 'muscles'){ muscles.visible = true; }
  if(key === 'nerves'){ nerves.visible = true; }

  if(key === 'heart'){
    state.heartActive = true;
    heartClockStart = performance.now();
    startHeartbeat();
  } else if(fromSidebar){
    state.heartActive = false;
    stopHeartbeat();
  }
}

/* =========================================================
   RAYCASTING — click/tap any body part
========================================================= */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
function onPointerSelect(clientX, clientY){
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((clientX-rect.left)/rect.width)*2 - 1;
  pointer.y = -((clientY-rect.top)/rect.height)*2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const targets = Array.from(interactive.values()).filter(m=>m.visible !== false && m.parent && m.parent.visible !== false);
  const hits = raycaster.intersectObjects(targets, false);
  if(hits.length){
    const mesh = hits[0].object;
    const key = mesh.userData.infoKey;
    if(key) selectOrgan(key, true);
  }
}
renderer.domElement.addEventListener('pointerdown', (e)=>{
  renderer.domElement.dataset.downX = e.clientX;
  renderer.domElement.dataset.downY = e.clientY;
});
renderer.domElement.addEventListener('pointerup', (e)=>{
  const dx = Math.abs(e.clientX - renderer.domElement.dataset.downX);
  const dy = Math.abs(e.clientY - renderer.domElement.dataset.downY);
  if(dx<6 && dy<6){ onPointerSelect(e.clientX, e.clientY); }
});

/* =========================================================
   RENDER LOOP
========================================================= */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  updateCamAnim(now);
  updateHeartPulse(now);
  rimGreen.intensity = 5 + Math.sin(now*0.002)*1.5;
  rimBlue.intensity = 4 + Math.cos(now*0.0017)*1.2;
  controls.update();
  renderer.render(scene, camera);
}
